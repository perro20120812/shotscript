[package]
name = "shotscript-license-core"
version = "0.1.0"
edition = "2021"
description = "ShotScript 激活码核心：RSA-SHA256 签发/验签/编解码（纯 Rust，无 napi 依赖）"
license = "MIT"

[dependencies]
rsa = { version = "0.9", features = ["pem"] }
sha2 = { version = "0.10", features = ["oid"] }
bs58 = "0.5"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
